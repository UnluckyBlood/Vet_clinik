<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetLove</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <img src="img/logo.svg" alt="" class="logo">
                <h2 class="first_page_h2">Журнал приёмов</h2>
                <p class="first_page_p" id="petInfo">Загрузка данных...</p>
            </div>
            <div class="content patients-content">
                <div class="patients-list" id="appointmentsList"></div>
            </div>
            <div class="buttons-container">
                <a href="#" id="backButton">
                    <button type="button" class="First-button tertiary">Назад к питомцам</button>
                </a>
                <a href="add_priem.html" id="addAppointmentLink" style="display: none;">
                    <button type="button" class="First-button tertiary">Добавить прием</button>
                </a>
            </div>
        </div>
    </div>

<script>
function setupNavigation() {
            const userRole = localStorage.getItem('userRole');
            const backButton = document.getElementById('backButton');
            
            if (userRole === 'vet') {
                backButton.href = 'slayre.html'; // Изменено с pets.html на slayer.html
            } else if (userRole === 'pet_owner') {
                backButton.href = 'home_user.html';
            } else {
                backButton.href = 'index.html';
            }
        }

    async function loadPetData() {
        const urlParams = new URLSearchParams(window.location.search);
        const petId = urlParams.get('pet_id');
        
        setupNavigation();

        if (!petId) {
            document.getElementById('petInfo').textContent = '❌ Питомец не выбран';
            return;
        }

        try {
            const petResponse = await fetch(`http://localhost:5000/api/pet/${petId}`);
            if (!petResponse.ok) throw new Error('Ошибка загрузки питомца');
            const pet = await petResponse.json();
            document.getElementById('petInfo').textContent = `${pet.name} (ID: ${pet.id})`;

            const appointmentsResponse = await fetch(`http://localhost:5000/api/appointments/${petId}`);
            if (!appointmentsResponse.ok) throw new Error('Ошибка загрузки записей');
            const appointments = await appointmentsResponse.json();

            const container = document.getElementById('appointmentsList');
            container.innerHTML = '';
            
            if (Array.isArray(appointments)) {
                appointments.forEach(appointment => {
                    const item = document.createElement('div');
                    item.className = 'patient-item';
                    item.innerHTML = `
                        <div class="patient-link">
                            <h3 class="patient-name">${appointment.type}</h3>
                            <p class="patient-id">Дата: ${new Date(appointment.date).toLocaleDateString()}</p>
                            ${appointment.pdf_path ? 
                                `<a href="${appointment.pdf_path}" target="_blank" class="pdf-link">PDF документ</a>` : ''}
                        </div>
                    `;
                    container.appendChild(item);
                });
            }
            
        } catch (error) {
            console.error('Ошибка загрузки:', error);
            document.getElementById('petInfo').textContent = 'Ошибка загрузки данных';
        } finally {
            const userRole = localStorage.getItem('userRole');
            if (userRole === 'vet') {
                document.getElementById('addAppointmentLink').style.display = 'inline-block';
                const petId = urlParams.get('pet_id');
                document.getElementById('addAppointmentLink').href = `add_priem.html?pet_id=${petId}`;
            }
        }
    }

    window.addEventListener('DOMContentLoaded', loadPetData);
</script>
</body>
</html>
