<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetLove - Проверка лицензии</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="header">
                <a href="home_admin.html"><button class="back-button"><span><</span></button></a>
                <img src="img/logo.jpg" alt="Логотип" class="logo">
            </div>
            <div class="content">
                <h2>Проверка лицензии</h2>
                
                <form id="vetForm">
                    <div class="field-value" id="vetId"></div>
                    
                    <label>ФИО врача:</label>
                    <div class="field-value" id="fullname"></div>
                    
                    <label>Телефон:</label>
                    <div class="field-value" id="phone"></div>
                    
                    <label>E-mail:</label>
                    <div class="field-value" id="email"></div>
                    
                    <label>Номер лицензии:</label>
                    <div class="field-value" id="licenseNumber"></div>
                    
                    <label>Дата выдачи:</label>
                    <div class="field-value" id="issueDate"></div>
                    
                    <label>Кем выдана:</label>
                    <div class="field-value" id="issuedBy"></div>
                    
                    <div class="two-in-row">
                        <div class="half-width">
                            <button type="submit" name="action" value="approve" class="First-button">Одобрить</button>
                        </div>
                        <div class="half-width">
                            <button type="submit" name="action" value="reject" class="First-button">Отклонить</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div id="notification" class="notification"></div>

    <script>
        // Функция уведомлений
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            setTimeout(() => notification.classList.remove('show'), 3000);
        }

        // Загрузка данных при открытии страницы
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const vetId = urlParams.get('id');

            try {
                const response = await fetch(`http://localhost:5000/api/vet/${vetId}`);
                const vetData = await response.json();

                // Заполняем данные
                document.getElementById('vetId').textContent = vetData.id;
                document.getElementById('fullname').textContent = vetData.name;
                document.getElementById('phone').textContent = vetData.phone;
                document.getElementById('email').textContent = vetData.email;
                document.getElementById('licenseNumber').textContent = vetData.license_number;
                document.getElementById('issueDate').textContent = vetData.issue_date;
                document.getElementById('issuedBy').textContent = vetData.issued_by;

            } catch (error) {
                showNotification('Ошибка загрузки данных', 'error');
            }
        });

        // Обработка формы
        document.getElementById('vetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const vetId = new URLSearchParams(window.location.search).get('id');
            const action = document.activeElement.value;

            try {
                const endpoint = action === 'approve' 
                    ? `approve-vet/${vetId}` 
                    : `reject-vet/${vetId}`;

                const response = await fetch(`http://localhost:5000/api/${endpoint}`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    throw new Error('Ошибка сервера');
                }

                showNotification(
                    action === 'approve' 
                        ? '✅ Ветеринар одобрен!' 
                        : '❌ Ветеринар отклонен!',
                    action
                );

                setTimeout(() => {
                    window.location.href = 'home_admin.html';
                }, 1000);

            } catch (error) {
                showNotification(error.message, 'error');
            }
        });
    </script>
</body>
</html>
