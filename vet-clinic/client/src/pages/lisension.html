<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetLove - Лицензия</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="header">
                <a href="home_vet.html"><button class="back-button"><span><</span></button></a>
                <img src="img/logo.jpg" alt="Логотип" class="logo">
            </div>
            <div class="content">
                <h2>Лицензия</h2>
                
                <form id="licenseInfo">
                    <div class="field-value" id="userId"></div>
                    <label>ФИО врача:</label>
                    <div class="field-value" id="vetName"></div>
                    <label>Телефон:</label>
                    <div class="field-value" id="vetPhone"></div>
                    <label>E-mail:</label>
                    <div class="field-value" id="vetEmail"></div>
                    <label>Номер лицензии:</label>
                    <div class="field-value" id="licenseNumber"></div>
                    <label>Дата выдачи:</label>
                    <div class="field-value" id="issueDate"></div>
                    <label>Кем выдана:</label>
                    <div class="field-value" id="issuedBy"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Загрузка данных при открытии страницы
        document.addEventListener('DOMContentLoaded', async () => {
            const userId = localStorage.getItem('userId');
            
            try {
                const [userResponse, licenseResponse] = await Promise.all([
                    fetch(`http://localhost:5000/api/user/${userId}`),
                    fetch(`http://localhost:5000/api/vet/${userId}`)
                ]);

                const userData = await userResponse.json();
                const licenseData = await licenseResponse.json();

                // Форматирование даты
                const formatDate = (dateString) => {
                    const date = new Date(dateString);
                    return date.toLocaleDateString('ru-RU');
                };

                // Заполнение данных
                document.getElementById('userId').textContent = `ID: ${userData.id}`;
                document.getElementById('vetName').textContent = userData.name;
                document.getElementById('vetPhone').textContent = userData.phone;
                document.getElementById('vetEmail').textContent = userData.email;
                document.getElementById('licenseNumber').textContent = licenseData.license_number;
                document.getElementById('issueDate').textContent = formatDate(licenseData.issue_date);
                document.getElementById('issuedBy').textContent = licenseData.issued_by;

            } catch (error) {
                alert('Ошибка загрузки данных: ' + error.message);
            }
        });
    </script>
</body>
</html>
