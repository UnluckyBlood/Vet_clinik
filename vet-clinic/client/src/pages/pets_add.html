<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetLove</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <a href="animals_user.html"><button class="back-button"><span><</span></button></a>
                <img src="img/logo.svg" alt="Логотип" class="logo">
            </div>
            <div class="profile-nav_add_picture">
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <label for="fileInput" class="nav-button photo-placeholder">
                    <div class="photo-wrapper">
                        <button id="resetPhotoBtn" class="reset-btn" title="Удалить фото">×</button>
                        <div class="photo-container">
                            <img id="photoPreview" class="photo-preview" alt="Превью фото">
                            <img id="photoIcon" src="../img/photo_add.svg" alt="Добавить фотографию">
                        </div>
                    </div>
                    <span>Добавить</span>
                </label>
            </div>

            <form id="petForm">
                <label for="petName">Имя питомца:</label>
                <input type="text" id="petName" class="input_register" placeholder="Введите имя питомца" required>

                <label for="petAge">Возраст:</label>
                <select id="petAge" class="input_register_fix" required>
                    <option value="" disabled selected>Выберите возраст</option>
                    <option value="1">До 1 года</option>
                    <option value="2">1-3 года</option>
                    <option value="3">3-5 лет</option>
                    <option value="4">5+ лет</option>
                </select>

                <div class="form-section two-in-row">
                    <div class="half-width">
                        <label for="petBreed">Вид:</label>
                        <select id="petBreed" class="input_register" required>
                            <option value="" disabled selected>Выберите вид</option>
                            <option value="dog">Собака</option>
                            <option value="cat">Кошка</option>
                            <option value="other">Другое</option>
                        </select>
                    </div>
                    
                    <div class="half-width">
                        <label for="petGender">Пол:</label>
                        <select id="petGender" class="input_register" required>
                            <option value="" disabled selected>Выберите пол</option>
                            <option value="male">Мужской</option>
                            <option value="female">Женский</option>
                        </select>
                    </div>
                </div>

                <div class="form-section">
                    <label for="petType">Порода:</label>
                    <input type="text" id="petType" class="input_register" placeholder="Введите породу животного" required>
                </div>

                <button type="submit" class="First-button">Сохранить</button>
            </form>
        </div>
    </div>

    <script>
        // Обработчик сброса фото
        document.getElementById('resetPhotoBtn').addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            document.getElementById('fileInput').value = '';
            document.getElementById('photoPreview').src = '';
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('photoIcon').style.display = 'block';
            this.style.display = 'none';
        });

        // Обработчик загрузки фото
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('photoPreview').src = e.target.result;
                    document.getElementById('photoPreview').style.display = 'block';
                    document.getElementById('photoIcon').style.display = 'none';
                    document.getElementById('resetPhotoBtn').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Отправка формы
        document.getElementById('petForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Валидация
            const requiredFields = [
                { id: 'petName', name: 'Имя питомца' },
                { id: 'petAge', name: 'Возраст' },
                { id: 'petBreed', name: 'Вид' },
                { id: 'petGender', name: 'Пол' },
                { id: 'petType', name: 'Порода' }
            ];

            let isValid = true;
            document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
            document.querySelectorAll('.error-message').forEach(el => el.remove());

            requiredFields.forEach(field => {
                const element = document.getElementById(field.id);
                if (!element.value.trim()) {
                    element.classList.add('error');
                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'error-message';
                    errorMsg.textContent = `Поле "${field.name}" обязательно`;
                    element.parentNode.appendChild(errorMsg);
                    isValid = false;
                }
            });

            if (!isValid) return;

            // Сбор данных
            const userId = localStorage.getItem('userId');
            if (!userId) {
                window.location.href = 'login.html';
                return;
            }

            const formData = new FormData();
            formData.append('owner_id', userId);
            formData.append('name', document.getElementById('petName').value);
            formData.append('age', document.getElementById('petAge').value);
            formData.append('breed', document.getElementById('petBreed').value);
            formData.append('gender', document.getElementById('petGender').value);
            formData.append('type', document.getElementById('petType').value);
            
            const file = document.getElementById('fileInput').files[0];
            if (file) formData.append('photo', file);

            try {
                const response = await fetch('http://localhost:5000/api/add-pet', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Ошибка сервера');
                }

                alert('Питомец успешно добавлен!');
                window.location.href = 'animals_user.html';
                
            } catch (error) {
                console.error('Ошибка:', error);
                alert(error.message || 'Не удалось добавить питомца');
            }
        });
    </script>
</body>
</html>
