<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetLove</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <img src="img/logo.svg" alt="" class="logo"></img>
                <h2 class="first_page_h2">Добро пожаловать, </h2>
                <p class="first_page_p" id="userName"></p>
            </div>
            <div class="profile-nav">
                <a href="profile_user.html" class="nav-button">
                    <img src="../img/profil.svg" alt="Профиль">
                    <span>Профиль</span>
                </a>
                
                <a href="animals_user.html" class="nav-button">
                    <img src="../img/paw.svg" alt="Питомцы">
                    <span>Питомцы</span>
                </a>
                
                <a href="index.html" class="nav-button">
                    <img src="../img/exit.svg" alt="Выйти">
                    <span>Выйти</span>
                </a>
            </div>
        </div>
        
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userId = localStorage.getItem('userId');
            
            if (!userId) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/api/user/${userId}`);
                const userData = await response.json();
                
                document.getElementById('userName').textContent = userData.name;
                document.querySelector('.first_page_h2').textContent += userData.name;

            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                alert('Не удалось загрузить данные пользователя');
            }
        });
    </script>
</body>
</html>
