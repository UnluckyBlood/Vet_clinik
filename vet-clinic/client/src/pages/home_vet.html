<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetLove</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <img src="img/logo.svg" alt="" class="logo"></img>
                <h2 class="first_page_h2">Добро пожаловать, </h2>     
                <span id="vetName" class="first_page_p"></span>
            </div>
            <div class="profile-nav">
                <a href="profile_vet.html" class="nav-button">
                    <img src="../img/profil.svg" alt="Профиль">
                    <span>Редактировать данные</span>
                </a>
                
                <a href="slayre.html" class="nav-button">
                    <img src="../img/paw.svg" alt="Пациенты">
                    <span>Пациенты</span>
                </a>
                
                <a href="index.html" class="nav-button">
                    <img src="../img/exit.svg" alt="Выйти">
                    <span>Выйти</span>
                </a>
                <a href="lisension.html" class="nav-button">
                    <img src="../img/licension.svg" alt="Лицензия">
                    <span>Лицензия</span>
                </a>
            </div>
        </div>
        
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const userId = localStorage.getItem('userId');
        
        if (!userId) {
            window.location.href = 'login.html';
            return;
        }

        try {
            const response = await fetch(`http://localhost:5000/api/user/${userId}`);
            const userData = await response.json();
            
            document.getElementById('vetName').textContent = userData.name;

        } catch (error) {
            console.error('Ошибка загрузки данных:', error);
            alert('Не удалось загрузить данные ветеринара');
        }
    });
</script>
</body>
</html>
