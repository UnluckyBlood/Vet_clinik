<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetLove - Профиль</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="header">
                <a href="home_user.html"><button class="back-button"><span><</span></button></a>
                <img src="img/logo.jpg" alt="" class="logo"></img>
            </div>
            <div class="content">
                <h2>Мой профиль</h2>
                
                <form id="profileForm">
                    <label for="name">Ваше имя:</label>
                    <input class="input_register" type="text" id="name" required>
                    
                    <label for="email">Ваш E-mail:</label>
                    <input class="input_register" type="email" id="email" required>
                    
                    <label for="phone">Номер телефона:</label>
                    <input class="input_register" 
                        type="tel" 
                        id="phone" 
                        placeholder="+7 (XXX) XXX-XX-XX" 
                        pattern="\+7\s?[\(]{0,1}[0-9]{3}[\)]{0,1}\s?\d{3}[-]{0,1}\d{2}[-]{0,1}\d{2}"
                        required
                    >
                    <button type="submit" class="First-button">Сохранить</button>
                </form>
            </div>
        </div>
    </div>

<script>
    // Загрузка данных пользователя и лицензии (для ветеринаров)
    async function loadUserData() {
        const userId = localStorage.getItem('userId');
        
        try {
            // Загрузка основных данных
            const userResponse = await fetch(`http://localhost:5000/api/user/${userId}`);
            const userData = await userResponse.json();

            document.getElementById('name').value = userData.name;
            document.getElementById('email').value = userData.email;
            document.getElementById('phone').value = userData.phone;

            // Если пользователь - ветеринар, загружаем лицензию
            if (userData.role === 'vet') {
                const licenseResponse = await fetch(`http://localhost:5000/api/vet/${userId}`);
                const licenseData = await licenseResponse.json();

                document.getElementById('fullname').value = licenseData.fullname;
                document.getElementById('licenseNumber').value = licenseData.license_number;
                document.getElementById('issueDate').value = licenseData.issue_date;
                document.getElementById('issuedBy').value = licenseData.issued_by;
            }

        } catch (error) {
            alert('Ошибка загрузки данных');
        }
    }

    // Отправка обновленных данных
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const userId = localStorage.getItem('userId');

        const updatedData = {
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.replace(/\D/g, '')
        };

        // Если ветеринар, добавляем данные лицензии
        const role = localStorage.getItem('userRole'); // Предполагаем, что роль сохранена при входе
        if (role === 'vet') {
            updatedData.licenseData = {
                fullname: document.getElementById('fullname').value.trim(),
                licenseNumber: document.getElementById('licenseNumber').value.trim(),
                issueDate: document.getElementById('issueDate').value,
                issuedBy: document.getElementById('issuedBy').value.trim()
            };
        }

        // Валидация телефона
        if (updatedData.phone.length !== 11) {
            alert('Телефон должен содержать 11 цифр');
            return;
        }

        try {
            const response = await fetch(`http://localhost:5000/api/update-user/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || "Ошибка обновления");
            }

            alert('Данные успешно обновлены!');
            window.location.reload();

        } catch (error) {
            alert(error.message);
        }
    });

    // Инициализация
    window.addEventListener('DOMContentLoaded', () => {
        loadUserData();
        // Маска для телефона (код из предыдущего примера)
    });
</script>
</body>
</html>
