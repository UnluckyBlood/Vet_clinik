<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetLove - Профиль</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="header">
                <a href="home_user.html"><button class="back-button"><span><</span></button></a>
                <img src="img/logo.jpg" alt="" class="logo">
            </div>
            <div class="content">
                <h2>Мой профиль</h2>
                
                <form id="profileForm">
                    <label for="name">Ваше имя:</label>
                    <input class="input_register" type="text" id="name" required>
                    
                    <label for="email">Ваш E-mail:</label>
                    <input class="input_register" type="email" id="email" required>
                    
                    <label for="phone">Номер телефона:</label>
                    <input class="input_register" 
                        type="tel" 
                        id="phone" 
                        placeholder="+7 (XXX) XXX-XX-XX" 
                        pattern="\+7\s?[\(]{0,1}[0-9]{3}[\)]{0,1}\s?\d{3}[-]{0,1}\d{2}[-]{0,1}\d{2}"
                        required
                    >
                    <button type="submit" class="First-button">Сохранить</button>
                </form>
            </div>
        </div>
    </div>

    <script>
                document.getElementById('phone').addEventListener('input', function(e) {
            const x = e.target.value.replace(/\D/g, '').match(/(\d{0,1})(\d{0,3})(\d{0,3})(\d{0,2})(\d{0,2})/);
            e.target.value = !x[2] ? '+7' : `+7 (${x[2]}${x[3] ? `) ${x[3]}` : ''}${x[4] ? `-${x[4]}` : ''}${x[5] ? `-${x[5]}` : ''}`;
        });
        // Загрузка данных пользователя
        async function loadUserData() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/api/user/${userId}`);
                const userData = await response.json();

                // Заполнение полей
                document.getElementById('name').value = userData.name;
                document.getElementById('email').value = userData.email;
                document.getElementById('phone').value = userData.phone;

            } catch (error) {
                alert('Ошибка загрузки данных: ' + error.message);
            }
        }

        // Обработчик отправки формы
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.replace(/\D/g, '')
            };

            try {
                const response = await fetch(`http://localhost:5000/api/update-user/${localStorage.getItem('userId')}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Ошибка обновления');
                }

                alert('Данные успешно обновлены!');
                window.location.reload();

            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        });

        // Инициализация
        window.addEventListener('DOMContentLoaded', loadUserData);
    </script>
</body>
</html>
