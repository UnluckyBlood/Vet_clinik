<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetLove - Добавление приема</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="header">
                <a href="jurnal_pacients.html"><button class="back-button"><span><</span></button></a>
                <img src="img/logo.jpg" alt="Логотип" class="logo">
            </div>
            <div class="content">
                <h2>Добавление приема</h2>
                
                <form id="register" enctype="multipart/form-data">
                    <input type="hidden" id="pet_id" name="pet_id">
                    <input type="hidden" id="vet_id" name="vet_id">
                    
                    <label for="vrach">ФИО врача:</label>
                    <div class="field-value" id="vetName">Загрузка...</div>
                    
                    <label for="address">Адрес приема:</label>
                    <input class="input_register" type="text" id="address" name="address" placeholder="Адрес приема" required>
                    
                    <label for="date">Дата приема:</label>
                    <input class="input_register" type="date" id="date" name="date" required>

                    <div class="checkbox-group">
                        <label for="role">Вид приема:</label>
                        <select id="role" name="type" required>
                            <option value="" disabled selected>Выберите тип</option>
                            <option value="osmotr">Осмотр</option>
                            <option value="privivka">Прививка</option>
                            <option value="vaction">Вакцинация</option>
                        </select>
                    </div>

                    <div id="dynamicFields"></div>

                    <label for="pdfUpload" class="Reg_main secondary">
                        <img src="img/pdf_download.svg" alt="PDF">
                        <span id="downloadFile">Загрузить PDF</span>
                        <input type="file" id="pdfUpload" name="pdf" accept=".pdf" hidden>
                        <span id="fileName">Файл не выбран</span>
                    </label>
                    
                    <button type="submit" class="First-button">Создать запись</button>
                </form>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        const roleSelect = document.getElementById('role');
        const dynamicFields = document.getElementById('dynamicFields');
        const notification = document.getElementById('notification');
        const vetId = localStorage.getItem('userId');
        // Инициализация
        document.addEventListener('DOMContentLoaded', async () => {
            const vetId = parseInt(localStorage.getItem('userId'));
            const urlParams = new URLSearchParams(window.location.search);
            const petId = parseInt(urlParams.get('pet_id'));

            // Валидация ID
            if (isNaN(petId)) {
                showNotification('❌ Некорректный ID питомца', 'error');
                return;
            }

            document.getElementById('pet_id').value = petId;
            document.getElementById('vet_id').value = vetId;

            // Загрузка данных ветеринара
            try {
                const response = await fetch(`http://localhost:5000/api/user/${vetId}`);
                if (!response.ok) throw new Error('Ошибка загрузки данных');
                const vetData = await response.json();
                document.getElementById('vetName').textContent = vetData.name;
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('vetName').textContent = 'Данные не найдены';
            }
        });

        // Шаблоны полей
        const fieldTemplates = {
            osmotr: `
                <label for="diagnostics">Диагностика:</label>
                <input class="input_register" type="text" id="diagnostics" name="diagnostics" required>
                <label for="treatment">Лечение:</label>
                <input class="input_register" type="text" id="treatment" name="treatment" required>
            `,
            privivka: `
                <label for="vaccine_type">Тип прививки:</label>
                <input class="input_register" type="text" id="vaccine_type" name="vaccine_type" required>
                <label for="reg_number">Рег. номер:</label>
                <input class="input_register" type="text" id="reg_number" name="reg_number" required>
            `,
            vaction: `
                <label for="vaccine_name">Вид вакцины:</label>
                <input class="input_register" type="text" id="vaccine_name" name="vaccine_name" required>
                <label for="batch_number">Номер партии:</label>
                <input class="input_register" type="text" id="batch_number" name="batch_number" required>
            `
        };

        roleSelect.addEventListener('change', () => {
            dynamicFields.innerHTML = fieldTemplates[roleSelect.value] || '';
        });

        document.getElementById('pdfUpload').addEventListener('change', function() {
            document.getElementById('fileName').textContent = this.files[0]?.name || 'Файл не выбран';
        });

        // Отправка формы
            document.getElementById('register').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const formData = new FormData(e.target);
                const petId = parseInt(formData.get('pet_id'));
                const vetId = parseInt(formData.get('vet_id'));

                // Валидация ID
                if (isNaN(petId)) {
                    showNotification('❌ Некорректный ID питомца', 'error');
                    return;
                }

                if (isNaN(vetId)) {
                    showNotification('❌ Некорректный ID ветеринара', 'error');
                    return;
                }

            try {
                const response = await fetch('http://localhost:5000/api/appointments', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка сервера');
                }

                showNotification('✅ Запись успешно создана!');
                setTimeout(() => {
                    window.location.href = `jurnal_pacients.html?pet_id=${petId}`;
                }, 1000);

            } catch (error) {
                console.error('Ошибка:', error);
                showNotification(`❌ ${error.message}`, 'error');
            }
        });

        function showNotification(message, type = 'success') {
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            setTimeout(() => notification.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
