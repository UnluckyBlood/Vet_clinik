<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetLove - Добавить пациента</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <a href="slayre.html"><button class="back-button"><span><</span></button></a>
                <img src="img/logo.svg" alt="Логотип" class="logo">
            </div>
            <div class="content">
                <form id="addPatientForm">
                    <label for="petId">ID питомца:</label>
                    <input type="text" 
                           id="petId" 
                           class="input_register" 
                           placeholder="Введите уникальный ID питомца"
                           required>
                    
                    <button type="submit" class="First-button">Добавить</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('addPatientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const vetId = localStorage.getItem('userId');
            const petId = document.getElementById('petId').value;

            try {
                const response = await fetch('http://localhost:5000/api/add-patient', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vet_id: vetId, pet_id: petId })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error);
                }

                alert('Пациент успешно добавлен!');
                window.location.href = 'slayre.html';
            } catch (error) {
                console.error('Ошибка:', error);
                alert(error.message);
            }
        });
    </script>
</body>
</html>
