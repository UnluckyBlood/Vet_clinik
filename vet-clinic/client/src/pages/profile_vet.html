<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetLove - Профиль ветеринара</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="header">
                <a href="home_vet.html"><button class="back-button"><span><</span></button></a>
                <img src="img/logo.jpg" alt="" class="logo">
            </div>
            <div class="content">
                <h2>Профиль ветеринара</h2>
                
                <form id="licenseForm">
                    <div class="checkbox-group">
                        <label for="name">ФИО:</label>
                        <input type="text" id="name" class="input_register" required>
                    </div>

                    <div class="checkbox-group">
                        <label for="emailConfirm">Новая почта:</label>
                        <input type="email" id="emailConfirm" class="input_register" required>
                    </div>
                    
                    <div class="checkbox-group">
                        <label for="password">Новый пароль:</label>
                        <input type="password" id="password" class="input_register" placeholder="Оставьте пустым, если не меняется" minlength="8">
                    </div>

                    <div class="checkbox-group">
                        <label for="licenseNumber">Номер лицензии(при изменении данных потребуется повторная проверка администратором):</label>
                        <input type="text" id="licenseNumber" class="input_register" required>
                    </div>
                    
                    <div class="checkbox-group">
                        <label for="issueDate">Дата выдачи:</label>
                        <input type="date" id="issueDate" class="input_register" required>
                    </div>
                    
                    <div class="checkbox-group">
                        <label for="issuedBy">Кем выдана:</label>
                        <input type="text" id="issuedBy" class="input_register" required>
                    </div>
                    
                    <button type="submit" class="First-button">Сохранить изменения</button>
                </form>
            </div>
        </div>
    </div>

<script>
    let initialLicenseData = {};
    let initialUserData = {};

    // Загрузка начальных данных
    async function loadInitialData() {
        const userId = localStorage.getItem('userId');
        if (!userId) {
            window.location.href = 'login.html';
            return;
        }

        try {
            // Параллельная загрузка данных
            const [userResponse, licenseResponse] = await Promise.all([
                fetch(`http://localhost:5000/api/user/${userId}`),
                fetch(`http://localhost:5000/api/vet/${userId}`)
            ]);

            const userData = await userResponse.json();
            const licenseData = await licenseResponse.json();

            // Заполнение полей
            document.getElementById('name').value = userData.name;
            document.getElementById('emailConfirm').value = userData.email;
            document.getElementById('licenseNumber').value = licenseData.license_number;
            document.getElementById('issueDate').value = licenseData.issue_date.split('T')[0];
            document.getElementById('issuedBy').value = licenseData.issued_by;

            // Сохранение исходных данных
            initialUserData = { ...userData };
            initialLicenseData = { ...licenseData };

        } catch (error) {
            alert('Ошибка загрузки данных: ' + error.message);
        }
    }

    // Проверка изменений в лицензии
    function checkLicenseChanges() {
        return (
            document.getElementById('licenseNumber').value !== initialLicenseData.license_number ||
            document.getElementById('issueDate').value !== initialLicenseData.issue_date.split('T')[0] ||
            document.getElementById('issuedBy').value !== initialLicenseData.issued_by
        );
    }

    // Обработчик отправки формы
    document.getElementById('licenseForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = {
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('emailConfirm').value.trim(),
            password: document.getElementById('password').value.trim() || undefined,
            licenseData: {
                licenseNumber: document.getElementById('licenseNumber').value.trim(),
                issueDate: document.getElementById('issueDate').value,
                issuedBy: document.getElementById('issuedBy').value.trim()
            },
            licenseChanged: checkLicenseChanges()
        };

        try {
            const response = await fetch(`http://localhost:5000/api/update-vet/${localStorage.getItem('userId')}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();
            
            if (!response.ok) throw new Error(result.error || 'Ошибка обновления');

            if (formData.licenseChanged) {
                alert('Данные лицензии отправлены на проверку!');
                localStorage.clear();
                window.location.href = 'login.html';
            } else {
                // Точечное обновление данных без перезагрузки
                initialUserData.name = formData.name;
                initialUserData.email = formData.email;
                alert('Данные успешно обновлены!');
            }

        } catch (error) {
            alert('Ошибка: ' + error.message);
        }
    });

    // Инициализация
    window.addEventListener('DOMContentLoaded', loadInitialData);
</script>
</body>
</html>
