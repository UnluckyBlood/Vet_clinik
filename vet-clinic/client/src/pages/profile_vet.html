<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetLove - Профиль ветеринара</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="header">
                <a href="home_vet.html"><button class="back-button"><span><</span></button></a>
                <img src="img/logo.jpg" alt="" class="logo">
            </div>
            <div class="content">
                <h2>Профиль ветеринара</h2>
                
                <form id="licenseForm">
                    <div class="checkbox-group">
                        <label for="fullname">ФИО:</label>
                        <input type="text" id="fullname" class="input_register" required>
                    </div>
                    <div class="checkbox-group">
                        <label for="emailConfirm">Новая почта:</label>
                        <input type="email" id="emailConfirm" class="input_register" required>
                    </div>
                    
                    <div class="checkbox-group">
                        <label for="password">Новый пароль:</label>
                        <input type="password" id="password" class="input_register" placeholder="Оставьте пустым, если не меняется" minlength="8">
                    </div>

                    <div class="checkbox-group">
                        <label for="licenseNumber">Номер лицензии:</label>
                        <input type="text" id="licenseNumber" class="input_register" required>
                    </div>
                    
                    <div class="checkbox-group">
                        <label for="issueDate">Дата выдачи:</label>
                        <input type="date" id="issueDate" class="input_register" required>
                    </div>
                    
                    <div class="checkbox-group">
                        <label for="issuedBy">Кем выдана:</label>
                        <input type="text" id="issuedBy" class="input_register" required>
                    </div>
                    
                    <button type="submit" class="First-button">Сохранить изменения</button>
                </form>
            </div>
        </div>
    </div>

    <script>
    let initialLicenseData = {};
    let initialUserData = {};

    // Загрузка начальных данных
    async function loadInitialData() {
        const userId = localStorage.getItem('userId');
        
        try {
            // Загрузка данных пользователя
            const userResponse = await fetch(`http://localhost:5000/api/user/${userId}`);
            const userData = await userResponse.json();
            document.getElementById('emailConfirm').value = userData.email;
            initialUserData = {
                email: userData.email,
                name: userData.name
            };

            // Загрузка данных лицензии
            const licenseResponse = await fetch(`http://localhost:5000/api/vet/${userId}`);
            const licenseData = await licenseResponse.json();
            
            initialLicenseData = {
                licenseNumber: licenseData.license_number,
                issueDate: licenseData.issue_date.split('T')[0],
                issuedBy: licenseData.issued_by
            };

            // Заполнение полей
            document.getElementById('fullname').value = userData.name;
            document.getElementById('licenseNumber').value = initialLicenseData.licenseNumber;
            document.getElementById('issueDate').value = initialLicenseData.issueDate;
            document.getElementById('issuedBy').value = initialLicenseData.issuedBy;

        } catch (error) {
            alert('Ошибка загрузки данных');
        }
    }

    // Проверка изменений в лицензии (только ключевые поля)
    function checkLicenseChanges() {
        return document.getElementById('licenseNumber').value !== initialLicenseData.licenseNumber ||
               document.getElementById('issueDate').value !== initialLicenseData.issueDate ||
               document.getElementById('issuedBy').value !== initialLicenseData.issuedBy;
    }

    // Обработчик отправки формы
    document.getElementById('licenseForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const licenseChanged = checkLicenseChanges();
        const nameChanged = document.getElementById('fullname').value !== initialUserData.name;
        const emailChanged = document.getElementById('emailConfirm').value !== initialUserData.email;
        const passwordChanged = document.getElementById('password').value.trim().length > 0;

        // Требовать подтверждение только для изменений лицензии
        if (licenseChanged) {
            const confirmChange = confirm('Изменение данных лицензии потребует повторной проверки! Вы будете разлогинены.');
            if (!confirmChange) return;
        }

        const formData = {
            name: document.getElementById('fullname').value.trim(),
            email: document.getElementById('emailConfirm').value.trim(),
            password: document.getElementById('password').value.trim() || undefined,
            licenseData: {
                licenseNumber: document.getElementById('licenseNumber').value.trim(),
                issueDate: document.getElementById('issueDate').value,
                issuedBy: document.getElementById('issuedBy').value.trim()
            },
            licenseChanged: licenseChanged
        };

        try {
            const response = await fetch(`http://localhost:5000/api/update-vet/${localStorage.getItem('userId')}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Ошибка обновления');

            if (licenseChanged) {
                alert('Данные лицензии отправлены на проверку!');
                localStorage.clear();
                window.location.href = 'login.html';
            } else {
                if (emailChanged) localStorage.setItem('userEmail', formData.email);
                alert('Данные успешно обновлены!');
                window.location.reload();
            }
        } catch (error) {
            alert(error.message);
        }
    });

    // Инициализация
    window.addEventListener('DOMContentLoaded', () => {
        loadInitialData();
        
        // Динамическое предупреждение для лицензии
        ['licenseNumber', 'issueDate', 'issuedBy'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                document.getElementById('licenseChangeWarning').style.display = 
                    checkLicenseChanges() ? 'block' : 'none';
            });
        });
    });
    </script>
</body>
</html>
